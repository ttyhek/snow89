<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>雪夜归途 · 最后一班列车</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  background:#050a10;
  font-family:"Georgia","宋体",serif;
  color:#b8c8d8;
  touch-action:none;
  position:relative;
  user-select:none;
  -webkit-user-select:none;
}

/* ============ 背景层 ============ */
/* 窗外风景层（动态） */
.scenery{position:fixed;inset:0;z-index:1;overflow:hidden;background:linear-gradient(180deg,#03060a,#0a1220 40%,#0d1626 100%)}
/* 远处路灯（随页面移动） */
.street-light{position:absolute;width:2px;height:14px;background:rgba(220,200,150,0.5);border-radius:50%;box-shadow:0 0 12px rgba(220,200,150,0.4),0 0 30px rgba(220,200,150,0.15);transition:left 1.5s ease,opacity 1.5s ease;opacity:0}
.street-light::after{content:"";position:absolute;top:-4px;left:-3px;width:8px;height:4px;background:rgba(220,200,150,0.6);border-radius:50%;filter:blur(2px)}
/* 雪地地平线 */
.snow-horizon{position:absolute;bottom:38%;left:0;right:0;height:80px;background:linear-gradient(to top,rgba(180,200,230,0.04),transparent);pointer-events:none}

/* ============ 车厢内部层 ============ */
.carriage{
  position:fixed;inset:0;z-index:2;pointer-events:none;
  background:
    /* 车顶阴影 */
    linear-gradient(180deg,rgba(0,0,0,0.7) 0%,transparent 20%),
    /* 车厢底部 */
    linear-gradient(0deg,rgba(0,0,0,0.85) 0%,transparent 25%),
    /* 整体冷灰蓝 */
    radial-gradient(ellipse at 50% 40%,rgba(30,50,75,0.3),transparent 70%);
}
/* 车内暖黄阅读灯（唯一暖色） */
.reading-lamp{
  position:fixed;top:8%;left:50%;transform:translateX(-50%);
  width:120px;height:60px;z-index:3;pointer-events:none;
  background:radial-gradient(ellipse at 50% 20%,rgba(200,160,80,0.12),transparent 70%);
  filter:blur(15px);
  animation:lampFlicker 4s ease-in-out infinite;
}
@keyframes lampFlicker{0%,100%{opacity:.5}48%{opacity:.5}50%{opacity:.8}52%{opacity:.5}80%{opacity:.6}}
/* 对面空座位轮廓 */
.empty-seat{
  position:fixed;right:8%;top:42%;width:110px;height:150px;z-index:3;pointer-events:none;
  border-radius:60px 60px 10px 10px;
  background:linear-gradient(180deg,rgba(40,60,85,0.25),rgba(20,35,55,0.15));
  border:1px solid rgba(100,140,180,0.08);
  box-shadow:inset 0 10px 30px rgba(0,0,0,0.4);
  opacity:.6;
}
.empty-seat::after{
  content:"";position:absolute;bottom:-4px;left:10%;right:10%;height:8px;
  background:rgba(50,75,100,0.3);border-radius:4px;filter:blur(2px);
}

/* ============ 车窗玻璃层（核心交互） ============ */
.window-glass{
  position:fixed;inset:0;z-index:20;pointer-events:none;
  background:
    radial-gradient(ellipse at 25% 15%,rgba(200,225,245,0.06),transparent 55%),
    linear-gradient(180deg,rgba(180,210,240,0.04),rgba(120,160,200,0.08));
  backdrop-filter:blur(1.2px);
  -webkit-backdrop-filter:blur(1.2px);
  /* 雾气 mask：手指划过擦除 */
  mask-image:radial-gradient(circle at var(--mx,50%) var(--my,50%),transparent 55px,rgba(0,0,0,0.95) 110px);
  -webkit-mask-image:radial-gradient(circle at var(--mx,50%) var(--my,50%),transparent 55px,rgba(0,0,0,0.95) 110px);
  transition:mask-image 0.25s ease-out;
}
/* 玻璃反光 */
.window-glass::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(135deg,transparent 30%,rgba(200,225,255,0.03) 50%,transparent 70%);
}
/* 结霜纹理 */
.frost-texture{
  position:fixed;inset:0;z-index:19;pointer-events:none;
  background:
    radial-gradient(circle at 10% 10%,rgba(180,215,245,0.06),transparent 25%),
    radial-gradient(circle at 85% 80%,rgba(160,200,240,0.05),transparent 20%),
    radial-gradient(circle at 70% 20%,rgba(190,220,250,0.04),transparent 22%);
  opacity:.7;
}

/* ============ 文案层 ============ */
.book{position:relative;z-index:10;width:100%;height:100vh;height:100dvh;display:flex;flex-direction:column}
.page{
  display:none;flex-direction:column;height:100%;justify-content:center;position:relative;
  padding:28px 28px;overflow:hidden;
}
.page.active{display:flex;animation:pageFadeIn 1s ease forwards}
@keyframes pageFadeIn{0%{opacity:0;transform:translateY(18px);filter:blur(5px)}100%{opacity:1;transform:translateY(0);filter:blur(0)}}

/* 广播字幕 */
.broadcast{
  position:absolute;top:calc(14% + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);
  font-family:"Courier New",monospace;font-size:.7rem;letter-spacing:3px;
  color:rgba(200,120,80,0.5);text-shadow:0 0 12px rgba(200,120,80,0.3);
  white-space:nowrap;text-align:center;
  animation:broadcastGlow 2s ease-in-out infinite;
}
@keyframes broadcastGlow{0%,100%{opacity:.4}50%{opacity:.8}}

/* 站点编号 */
.station-num{
  font-size:.65rem;letter-spacing:7px;color:#3a5a7a;
  font-family:"Arial",sans-serif;text-align:center;margin-bottom:8px;
}
/* 时间 */
.station-time{
  font-size:.7rem;letter-spacing:3px;color:#2a4a6a;
  font-family:"Courier New",monospace;text-align:center;margin-bottom:28px;
}

/* 文案内容 */
.page-content{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;width:100%}
.quote-main{
  font-size:1.32rem;line-height:2.1;color:#c8d8e8;
  text-shadow:0 0 30px rgba(140,180,220,.15);
  margin-bottom:.5em;padding:0 6px;
}
.quote-sub{
  font-size:1rem;line-height:2;color:#8ca4b8;
  font-style:italic;margin-bottom:.4em;padding:0 6px;
}
.quote-whisper{
  font-size:.86rem;line-height:1.9;color:#6a8298;
  font-style:italic;padding:16px 12px 0;margin-top:14px;
  border-top:1px solid rgba(120,160,200,.1);
  max-width:92%;margin-left:auto;margin-right:auto;
}
.wound{color:#b5534a;font-style:italic;text-shadow:0 0 14px rgba(180,60,50,.25)}
.ghost-text{
  color:rgba(160,190,220,0.35);font-style:italic;
  text-shadow:0 0 20px rgba(160,200,240,.2);
  animation:ghostFlicker 3s ease-in-out infinite;
}
@keyframes ghostFlicker{0%,100%{opacity:.3}50%{opacity:.7}}

/* 手写字（雾气上的字） */
.handwriting{
  position:fixed;top:38%;left:50%;transform:translate(-50%,-50%) rotate(-4deg);
  font-size:1.6rem;color:rgba(200,220,240,0.12);
  font-family:"KaiTi","楷体","STKaiti",serif;
  letter-spacing:8px;z-index:18;pointer-events:none;
  text-shadow:0 0 20px rgba(180,220,255,0.15);
  opacity:0;transition:opacity 1.5s ease;
  white-space:nowrap;
}
.handwriting.show{opacity:1}

/* ============ 底部进度（永远到不了的终点） ============ */
.progress-info{
  position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));
  left:0;right:0;z-index:25;text-align:center;pointer-events:none;
}
.progress-text{
  font-size:.65rem;letter-spacing:3px;color:rgba(140,170,200,0.3);
  font-family:"Courier New",monospace;margin-bottom:6px;
  font-style:italic;
}
.progress-bar{
  width:60%;max-width:240px;height:2px;margin:0 auto;
  background:rgba(60,90,120,0.3);border-radius:2px;overflow:hidden;
}
.progress-fill{
  height:100%;width:0%;
  background:linear-gradient(90deg,rgba(120,160,200,0.4),rgba(160,200,240,0.6));
  border-radius:2px;
  transition:width 1.5s ease;
  box-shadow:0 0 10px rgba(140,190,240,0.3);
}

/* ============ 滑动提示（拉下车窗） ============ */
.swipe-hint{
  position:fixed;bottom:calc(56px + env(safe-area-inset-bottom,0px));
  left:50%;transform:translateX(-50%);z-index:25;
  text-align:center;pointer-events:none;
  animation:hintPulse 2.5s ease-in-out infinite;
}
@keyframes hintPulse{0%,100%{opacity:.25}50%{opacity:.6}}
.hint-icon{font-size:1.1rem;display:block;margin-bottom:2px;color:rgba(160,200,240,.5)}
.hint-text{font-size:.62rem;letter-spacing:3px;color:rgba(140,180,220,.35);font-style:italic;white-space:nowrap}

/* ============ 长按提示 ============ */
.hold-indicator{
  position:fixed;top:calc(20px + env(safe-area-inset-top,0px));right:18px;
  z-index:25;pointer-events:none;
  width:36px;height:36px;border-radius:50%;
  border:1px solid rgba(160,200,240,0.12);
  display:flex;align-items:center;justify-content:center;
  font-size:.85rem;color:rgba(160,200,240,0.3);
  opacity:0;transition:opacity .5s;
}
.hold-indicator.show{opacity:1}
.hold-indicator .ring{
  position:absolute;inset:0;border-radius:50%;
  border:1px solid rgba(160,200,240,0.3);
  opacity:0;
}
.hold-indicator.holding .ring{
  animation:holdRing 2s linear forwards;
}
@keyframes holdRing{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(1.4)}}

/* ============ 全局飘雪 ============ */
.float-snowflake{
  position:fixed;color:rgba(190,220,250,.1);pointer-events:none;z-index:6;
  animation:floatDown linear infinite;user-select:none;
}
@keyframes floatDown{0%{transform:translateY(-40px) rotate(0deg);opacity:0}10%{opacity:.5}90%{opacity:.4}100%{transform:translateY(105vh) rotate(360deg);opacity:0}}

/* ============ 雪花画布 ============ */
#snow-canvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:5}

/* ============ 隧道层 ============ */
.tunnel-overlay{
  position:fixed;inset:0;z-index:100;background:#000;
  opacity:0;pointer-events:none;transition:opacity 1.5s ease;
}
.tunnel-overlay.active{opacity:1;pointer-events:auto}

/* ============ 幻影层 ============ */
.ghost-figure{
  position:fixed;right:12%;top:38%;width:70px;height:130px;z-index:14;pointer-events:none;
  background:radial-gradient(ellipse at 50% 20%,rgba(190,215,240,0.12),transparent 70%);
  border-radius:40px 40px 15px 15px;
  filter:blur(10px);opacity:0;transition:opacity 2s ease;
}
.ghost-figure.show{opacity:.7}

/* ============ 围巾（遗物） ============ */
.scarf{
  position:fixed;bottom:16%;left:50%;transform:translateX(-50%) rotate(-6deg);
  width:100px;height:40px;z-index:13;pointer-events:none;
  background:linear-gradient(135deg,rgba(120,60,70,0.25),rgba(90,45,55,0.15));
  border-radius:20px 20px 8px 8px;
  box-shadow:0 4px 20px rgba(0,0,0,0.4);
  opacity:0;transition:opacity 1.5s ease;
}
.scarf.show{opacity:.8}
.scarf::after{
  content:"";position:absolute;bottom:-12px;right:15px;width:12px;height:22px;
  background:inherit;border-radius:0 0 6px 6px;transform:rotate(8deg);
}

/* ============ 雪花画布 ============ */
@media(max-height:640px){
  .quote-main{font-size:1.12rem;line-height:1.9}
  .quote-sub{font-size:.88rem;line-height:1.8}
  .quote-whisper{font-size:.78rem;padding-top:12px;margin-top:10px}
  .station-num{margin-bottom:4px}
  .station-time{margin-bottom:18px}
}
</style>
</head>
<body>

<!-- ============ 窗外风景 ============ -->
<div class="scenery" id="scenery">
  <div class="snow-horizon"></div>
  <div class="street-light" id="light1"></div>
  <div class="street-light" id="light2"></div>
  <div class="street-light" id="light3"></div>
</div>

<!-- ============ 车厢内部 ============ -->
<div class="carriage"></div>
<div class="reading-lamp"></div>
<div class="empty-seat"></div>

<!-- ============ 雪花画布 ============ -->
<canvas id="snow-canvas"></canvas>

<!-- ============ 霜花纹理 ============ -->
<div class="frost-texture"></div>

<!-- ============ 文案层 ============ -->
<div class="book" id="book"></div>

<!-- ============ 车窗玻璃层（交互核心） ============ -->
<div class="window-glass" id="windowGlass"></div>

<!-- ============ 雾气手写字 ============ -->
<div class="handwriting" id="handwriting">等 我 回 来</div>

<!-- ============ 幻影 ============ -->
<div class="ghost-figure" id="ghostFigure"></div>

<!-- ============ 围巾 ============ -->
<div class="scarf" id="scarf"></div>

<!-- ============ 进度信息 ============ -->
<div class="progress-info">
  <div class="progress-text" id="progressText">距离终点站还有 9 站</div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
</div>

<!-- ============ 滑动提示 ============ -->
<div class="swipe-hint" id="swipeHint">
  <span class="hint-icon">↓</span>
  <span class="hint-text">向下滑动 · 拉下车窗</span>
</div>

<!-- ============ 长按提示 ============ -->
<div class="hold-indicator" id="holdIndicator">
  ✦
  <div class="ring"></div>
</div>

<!-- ============ 隧道层 ============ -->
<div class="tunnel-overlay" id="tunnelOverlay"></div>

<script>
// ==================== 数据：九站旅程 ====================
const stations = [
  {
    num: "始发站",
    time: "21:47",
    broadcast: "本次列车开往 · 没有你的未来",
    main: "车厢里只有我一个人。",
    sub: "对面的座位上，放着你忘拿走的围巾。",
    whisper: "我把它叠好，放在膝盖上。列车员说，下一站是「回忆」。",
    effect: null
  },
  {
    num: "第 2 站",
    time: "21:58",
    broadcast: "前方到站 · 初雪",
    main: "窗外开始下雪了。",
    sub: "我想起那年初雪，你站在路灯下等我。",
    whisper: "你的鼻尖冻得通红，却笑着说——「这样冷的天，才能记住彼此的体温。」",
    effect: "streetlights"
  },
  {
    num: "第 3 站",
    time: "22:15",
    broadcast: "前方到站 · 习惯",
    main: "你总是坐在靠窗的位置。",
    sub: "你说你喜欢看风景，其实我知道，",
    whisper: "你只是不想让我看到你哭。现在窗边空了，我却不敢坐过去。",
    effect: null
  },
  {
    num: "第 4 站",
    time: "22:31",
    broadcast: "列车进入隧道 · 请注意",
    main: "列车进入隧道，窗外一片漆黑。",
    sub: "玻璃上映出我的脸，和旁边空荡荡的座位。",
    whisper: "我闭上眼睛，假装你还在。隧道很长，长到我可以骗自己一辈子。",
    effect: "tunnel"
  },
  {
    num: "第 5 站",
    time: "22:48",
    broadcast: "前方到站 · 站台",
    main: "列车短暂停靠，没有人上车。",
    sub: "站台上有个穿灰色大衣的人，背影很像你。",
    whisper: "我趴在窗户上看，直到列车开动——那个人转过身，不是你。",
    effect: "streetlights"
  },
  {
    num: "第 6 站",
    time: "23:02",
    broadcast: "前方到站 · 雾气",
    main: "车窗起了雾。",
    sub: "我下意识地在玻璃上写下你的名字。",
    whisper: "写到最后一笔时停住了。因为我知道，写了也不会有人回应。",
    effect: "handwriting"
  },
  {
    num: "第 7 站",
    time: "23:19",
    broadcast: "前方到站 · 你曾说过要去的地方",
    main: "广播说：下一站，是「你曾经说过要一起去的地方」。",
    sub: "我攥紧了你留下的围巾。",
    whisper: "那条围巾上，还有你的味道。但我已经记不清，那是洗衣液的味道，还是你的味道。",
    effect: "scarf"
  },
  {
    num: "第 8 站",
    time: "23:47",
    broadcast: "前方到站 · 幻影",
    main: "列车经过一座小站，车速很慢。",
    sub: "站台的灯光掠过车厢，我看见——",
    whisper: "对面的座位上，坐着你。我猛地转头，座位上只有围巾。玻璃上，我的倒影在哭。",
    effect: "ghost"
  },
  {
    num: "终点站",
    time: "00:00",
    broadcast: "终点站到了 · 请所有旅客带好回忆下车",
    main: "列车到站了。我站起来，把围巾留在座位上。",
    sub: "车门打开，冷风灌进来。外面雪停了，天快亮了。",
    whisper: "我走出车厢，没有回头。因为我知道，这趟列车，永远不会再载着你回来了。",
    effect: "final"
  }
];

const total = stations.length;
let current = 0;
let holdTimer = null;
let fogTimer = null;
let isDragging = false;
let startY = 0;
let currentY = 0;

// DOM
const book = document.getElementById('book');
const windowGlass = document.getElementById('windowGlass');
const handwriting = document.getElementById('handwriting');
const ghostFigure = document.getElementById('ghostFigure');
const scarf = document.getElementById('scarf');
const progressText = document.getElementById('progressText');
const progressFill = document.getElementById('progressFill');
const swipeHint = document.getElementById('swipeHint');
const holdIndicator = document.getElementById('holdIndicator');
const tunnelOverlay = document.getElementById('tunnelOverlay');
const scenery = document.getElementById('scenery');

// ==================== 构建页面 ====================
function build() {
  book.innerHTML = '';
  stations.forEach((s, i) => {
    const p = document.createElement('div');
    p.className = 'page' + (i === 0 ? ' active' : '');
    p.dataset.index = i;

    const content = document.createElement('div');
    content.className = 'page-content';

    const broadcast = document.createElement('div');
    broadcast.className = 'broadcast';
    broadcast.textContent = '📢 ' + s.broadcast;
    content.appendChild(broadcast);

    const num = document.createElement('div');
    num.className = 'station-num';
    num.textContent = s.num;
    content.appendChild(num);

    const time = document.createElement('div');
    time.className = 'station-time';
    time.textContent = s.time;
    content.appendChild(time);

    const main = document.createElement('div');
    main.className = 'quote-main';
    main.textContent = s.main;
    content.appendChild(main);

    const sub = document.createElement('div');
    sub.className = 'quote-sub';
    sub.textContent = s.sub;
    content.appendChild(sub);

    const wh = document.createElement('div');
    wh.className = 'quote-whisper';
    wh.textContent = s.whisper;
    content.appendChild(wh);

    p.appendChild(content);
    book.appendChild(p);
  });
}

// ==================== 页面切换 ====================
function goToPage(index) {
  if (index < 0 || index >= total) return;

  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.page')[index].classList.add('active');

  current = index;

  // 更新进度
  const remaining = total - 1 - index;
  if (remaining > 0) {
    progressText.textContent = `距离终点站还有 ${remaining} 站`;
  } else {
    progressText.textContent = '终点站到了';
  }
  // 进度条（永远填不满的感觉）
  const fillPercent = (index / (total - 1)) * 85;
  progressFill.style.width = fillPercent + '%';

  // 触发页面特殊效果
  triggerEffect(stations[index].effect);

  // 更新滑动提示
  if (index === 0) {
    swipeHint.querySelector('.hint-text').textContent = '向下滑动 · 拉下车窗';
  } else if (index === total - 1) {
    swipeHint.querySelector('.hint-text').textContent = '这趟列车 · 到此为止';
  } else {
    swipeHint.querySelector('.hint-text').textContent = '向下滑动 · 拉下车窗';
  }

  // 长按提示（只在特定页面显示）
  if (index === 5 || index === 7) {
    holdIndicator.classList.add('show');
  } else {
    holdIndicator.classList.remove('show');
  }

  // 重置雾气
  windowGlass.style.setProperty('--mx', '50%');
  windowGlass.style.setProperty('--my', '50%');

  // 最后一页特殊背景
  if (index === total - 1) {
    document.body.style.background = '#0a0d12';
  } else {
    document.body.style.background = '#050a10';
  }
}

// ==================== 页面特效 ====================
function triggerEffect(effect) {
  // 隐藏所有特效元素
  ghostFigure.classList.remove('show');
  scarf.classList.remove('show');
  handwriting.classList.remove('show');

  if (effect === 'tunnel') {
    // 隧道效果
    setTimeout(() => {
      tunnelOverlay.classList.add('active');
      setTimeout(() => {
        tunnelOverlay.classList.remove('active');
      }, 2200);
    }, 600);
  }

  if (effect === 'handwriting') {
    setTimeout(() => {
      handwriting.classList.add('show');
    }, 800);
  }

  if (effect === 'ghost') {
    setTimeout(() => {
      ghostFigure.classList.add('show');
      setTimeout(() => {
        ghostFigure.classList.remove('show');
      }, 3000);
    }, 1000);
  }

  if (effect === 'scarf') {
    setTimeout(() => {
      scarf.classList.add('show');
    }, 600);
  }

  if (effect === 'streetlights') {
    // 路灯掠过
    const lights = document.querySelectorAll('.street-light');
    lights.forEach((light, i) => {
      light.style.opacity = '0';
      setTimeout(() => {
        light.style.left = (10 + i * 30) + '%';
        light.style.opacity = '1';
        setTimeout(() => {
          light.style.left = (60 + i * 15) + '%';
          light.style.opacity = '0';
        }, 1200);
      }, i * 400);
    });
  }

  if (effect === 'final') {
    // 最后一页：雪停
    setTimeout(() => {
      const flakes = document.querySelectorAll('.float-snowflake');
      flakes.forEach(f => f.style.animationPlayState = 'paused');
      // 画布雪停
      if (window._snowStop) window._snowStop();
    }, 1000);
  }
}

// ==================== 擦雾气交互 ====================
document.addEventListener('touchmove', (e) => {
  if (isDragging) return; // 拖拽时不擦雾
  const touch = e.touches[0];
  windowGlass.style.setProperty('--mx', touch.clientX + 'px');
  windowGlass.style.setProperty('--my', touch.clientY + 'px');

  // 3秒后雾气重新聚拢
  clearTimeout(fogTimer);
  fogTimer = setTimeout(() => {
    windowGlass.style.setProperty('--mx', '50%');
    windowGlass.style.setProperty('--my', '50%');
  }, 3000);
}, { passive: true });

// 鼠标移动（桌面调试用）
document.addEventListener('mousemove', (e) => {
  if (isDragging) return;
  windowGlass.style.setProperty('--mx', e.clientX + 'px');
  windowGlass.style.setProperty('--my', e.clientY + 'px');
  clearTimeout(fogTimer);
  fogTimer = setTimeout(() => {
    windowGlass.style.setProperty('--mx', '50%');
    windowGlass.style.setProperty('--my', '50%');
  }, 3000);
});

// ==================== 长按交互 ====================
let holdStartTime = 0;

function startHold(e) {
  holdIndicator.classList.add('holding');
  holdStartTime = Date.now();

  holdTimer = setTimeout(() => {
    // 长按2秒：显示手写字
    handwriting.classList.add('show');
    holdIndicator.classList.remove('holding');

    // 如果是第8站，同时显示幻影
    if (current === 7) {
      ghostFigure.classList.add('show');
      setTimeout(() => ghostFigure.classList.remove('show'), 2500);
    }

    // 震动反馈
    if (navigator.vibrate) navigator.vibrate(30);
  }, 2000);
}

function endHold() {
  holdIndicator.classList.remove('holding');
  if (holdTimer) {
    clearTimeout(holdTimer);
    holdTimer = null;
  }
}

document.addEventListener('touchstart', startHold, { passive: true });
document.addEventListener('touchend', endHold, { passive: true });
document.addEventListener('mousedown', startHold);
document.addEventListener('mouseup', endHold);

// ==================== 拉下车窗（滑动翻页） ====================
document.addEventListener('touchstart', (e) => {
  startY = e.changedTouches[0].screenY;
  isDragging = true;
}, { passive: true });

document.addEventListener('touchmove', (e) => {
  if (!isDragging) return;
  currentY = e.changedTouches[0].screenY - startY;
  // 玻璃跟随手指：下拉时玻璃向下移动（视觉上像是拉下车窗）
  if (currentY > 0) {
    windowGlass.style.transform = `translateY(${Math.min(currentY * 0.4, 60)}px)`;
    windowGlass.style.opacity = 1 - Math.min(currentY / 300, 0.4);
  }
}, { passive: true });

document.addEventListener('touchend', (e) => {
  if (!isDragging) return;
  isDragging = false;

  const dy = e.changedTouches[0].screenY - startY;

  // 回弹
  windowGlass.style.transform = 'translateY(0)';
  windowGlass.style.opacity = '1';

  if (dy > 80) {
    // 拉下超过阈值 → 下一页
    if (current < total - 1) {
      goToPage(current + 1);
    }
  } else if (dy < -80) {
    // 上推 → 上一页
    if (current > 0) {
      goToPage(current - 1);
    }
  }
  currentY = 0;
}, { passive: true });

// 鼠标拖拽（桌面调试）
let mouseStartY = 0;
document.addEventListener('mousedown', (e) => {
  mouseStartY = e.clientY;
  isDragging = true;
});
document.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  const dy = e.clientY - mouseStartY;
  if (dy > 0) {
    windowGlass.style.transform = `translateY(${Math.min(dy * 0.4, 60)}px)`;
    windowGlass.style.opacity = 1 - Math.min(dy / 300, 0.4);
  }
});
document.addEventListener('mouseup', (e) => {
  if (!isDragging) return;
  isDragging = false;
  const dy = e.clientY - mouseStartY;
  windowGlass.style.transform = 'translateY(0)';
  windowGlass.style.opacity = '1';

  if (dy > 80 && current < total - 1) goToPage(current + 1);
  else if (dy < -80 && current > 0) goToPage(current - 1);
});

// ==================== 键盘 ====================
window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
    e.preventDefault();
    if (current < total - 1) goToPage(current + 1);
  } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
    e.preventDefault();
    if (current > 0) goToPage(current - 1);
  }
});

// ==================== 全局飘雪 ====================
(function createFloatSnow() {
  const symbols = ['❄', '❅', '❆', '·', '•'];
  for (let i = 0; i < 16; i++) {
    const f = document.createElement('span');
    f.className = 'float-snowflake';
    f.textContent = symbols[Math.floor(Math.random() * symbols.length)];
    f.style.left = Math.random() * 100 + '%';
    f.style.animationDuration = (Math.random() * 12 + 10) + 's';
    f.style.animationDelay = (Math.random() * 20) + 's';
    f.style.fontSize = (Math.random() * 0.8 + 0.6) + 'rem';
    f.style.opacity = (Math.random() * 0.12 + 0.04);
    document.body.appendChild(f);
  }
})();

// ==================== 雪花画布 ====================
(function initSnow() {
  const canvas = document.getElementById('snow-canvas');
  const ctx = canvas.getContext('2d');
  let w, h;
  let flakes = [];
  let stopped = false;

  function initFlakes() {
    const area = w * h;
    let count = Math.floor(area / 14000);
    count = Math.min(220, Math.max(70, count));
    flakes = [];
    for (let i = 0; i < count; i++) {
      flakes.push({
        x: Math.random() * w,
        y: Math.random() * h,
        r: Math.random() * 2.6 + 0.6,
        d: Math.random() * 0.9 + 0.3,
        o: Math.random() * 0.55 + 0.25,
        wind: Math.random() * 1.3 - 0.5,
        phase: Math.random() * Math.PI * 2
      });
    }
  }

  function resize() {
    w = window.innerWidth;
    h = window.innerHeight;
    canvas.width = w;
    canvas.height = h;
    initFlakes();
  }

  function draw(f) {
    const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r * 2.2);
    g.addColorStop(0, `rgba(230,245,255,${f.o})`);
    g.addColorStop(0.5, `rgba(190,225,250,${f.o * 0.6})`);
    g.addColorStop(1, 'rgba(130,180,230,0)');
    ctx.beginPath();
    ctx.fillStyle = g;
    ctx.arc(f.x, f.y, f.r * 1.8, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.fillStyle = `rgba(255,255,255,${f.o * 0.9})`;
    ctx.arc(f.x, f.y, f.r * 0.5, 0, Math.PI * 2);
    ctx.fill();
  }

  function update() {
    if (stopped) return;
    for (let f of flakes) {
      f.y += f.d * (f.r * 0.85 + 0.6) * 0.68;
      f.x += f.wind * 0.5 + Math.sin(f.phase) * 0.14;
      f.phase += 0.018;
      if (f.y > h + 15) {
        f.y = -15;
        f.x = Math.random() * w;
        f.o = Math.random() * 0.55 + 0.25;
        f.wind = Math.random() * 1.3 - 0.5;
      }
      if (f.x > w + 15) f.x = -15;
      if (f.x < -15) f.x = w + 15;
    }
  }

  function render() {
    ctx.clearRect(0, 0, w, h);
    for (let f of flakes) draw(f);
    update();
    requestAnimationFrame(render);
  }

  window.addEventListener('resize', resize);
  resize();
  render();

  // 暴露停止方法给最终页
  window._snowStop = function () {
    stopped = true;
    // 让雪缓慢消失
    let fade = 1;
    const fadeInterval = setInterval(() => {
      fade -= 0.05;
      if (fade <= 0) {
        clearInterval(fadeInterval);
        return;
      }
      flakes.forEach(f => f.o *= 0.95);
    }, 100);
  };
})();

// ==================== 设备倾斜（雪斜向飘落） ====================
window.addEventListener('deviceorientation', (e) => {
  const tilt = Math.max(-30, Math.min(30, e.gamma || 0));
  const flakes = document.querySelectorAll('.float-snowflake');
  flakes.forEach(f => {
    f.style.transform = `translateX(${tilt * 0.5}px)`;
  });
}, { passive: true });

// ==================== 初始化 ====================
build();
goToPage(0);
</script>
